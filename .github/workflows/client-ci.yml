name: Client CI

on:
  push:
    branches:
      - 'Frontend'
      - 'Frontend/**'
    paths:
      - 'client/**'
  pull_request:
    branches:
      - 'Frontend'
      - 'Frontend/**'
    paths:
      - 'client/**'

defaults:
  run:
    working-directory: client

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Build production bundle
        run: npm run build
